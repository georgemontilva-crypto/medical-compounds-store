<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!--
      SAFETY NET ONLY — not the tags the site actually serves.

      This file is the single HTML document served for EVERY route, so anything
      declared here is declared by every URL: this exact title and description
      used to go out on /compounds, /faq, /contact and every /science and
      /legal page alike.

      server/_core/seoMeta.ts now strips this pair on every request and writes
      the route's own title, description, canonical, robots, og:/twitter: tags
      and JSON-LD in their place. These two survive only if that injection
      throws and the raw file is served — better a generic title than none.

      Nothing here is declared per-route any more, so don't add `robots`,
      `rel=canonical`, og:/twitter: or JSON-LD back: seoMeta.ts owns all of
      them, and a copy here would be a second, conflicting tag on every page.
    -->
    <title>Brighter Days Labs — Research Grade Peptides & Compounds</title>
    <meta name="description" content="Brighter Days Labs supplies ≥99% HPLC-verified research peptides and compounds with batch-specific Certificates of Analysis. Research Use Only." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      og:/twitter: and JSON-LD used to sit here. They moved to seoMeta.ts for
      the reason above: served from this file, the Organization and WebSite
      blocks went out on all 17 routes, which tells a crawler every URL is the
      site's front door. They are now written per route — Organization and
      WebSite on the home page only, Product on /compounds/:slug only.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      No analytics tag here. Traffic is counted by the site's own server (see
      shared/traffic.ts), so nothing about a visitor is sent to a third party.

      What used to sit here was a Umami tag inherited from the Manus scaffold,
      pointing at `%VITE_ANALYTICS_ENDPOINT%/umami`. Neither placeholder was
      ever defined, so Vite left the text as-is and every page load fetched a
      literal `/%VITE_ANALYTICS_ENDPOINT%/umami` — which the catch-all route
      answered with this HTML document, and the browser refused as a script. It
      collected nothing for as long as it existed.
    -->
    <!-- Lynx AI Chat Widget -->
    <script
      src="https://www.lynxaiassistant.com/api/widget.js"
      data-api-key="lx_65fe1ca24a3d807cb8565b931e91035093c4b3bd2d91378a"
      async
    ></script>
    <!-- End Lynx AI Widget -->
  </body>
</html>
